# Reference only: the shape of the Secret that deploy.sh creates from .env.
# Do not fill this in and apply it by hand. Real secret manifests are gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: snowflake-credentials
  namespace: telematics
type: Opaque
stringData:
  SNOWFLAKE_ACCOUNT: <orgname-accountname>
  SNOWFLAKE_USER: TELEMATICS_KAFKA_CONNECTOR
  SNOWFLAKE_ROLE: TELEMATICS_INGEST_ROLE
  SNOWFLAKE_WAREHOUSE: TELEMATICS_WH
  SNOWFLAKE_DATABASE: TELEMATICS
  SNOWFLAKE_BRONZE_SCHEMA: BRONZE
  SNOWFLAKE_PRIVATE_KEY: <base64 body of secrets/snowflake_rsa_key.p8, no header/footer/newlines>
