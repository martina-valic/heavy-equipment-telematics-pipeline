# Apply with deploy.sh, which first creates the kafka-topics-script ConfigMap and the
# snowflake-credentials Secret (both built from files outside this directory).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telematics
resources:
  - namespace.yaml
  - kafka.yaml
  - kafka-init-job.yaml
  - kafka-connect.yaml
  - kafka-ui.yaml
