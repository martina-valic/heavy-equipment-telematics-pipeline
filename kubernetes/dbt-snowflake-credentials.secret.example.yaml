# Reference only: the shape of the Secret that deploy.sh creates from .env.
# Do not fill this in and apply it by hand. Real secret manifests are gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: dbt-snowflake-credentials
  namespace: telematics
type: Opaque
stringData:
  SNOWFLAKE_ACCOUNT: <orgname-accountname>
  SNOWFLAKE_WAREHOUSE: TELEMATICS_WH
  SNOWFLAKE_DATABASE: TELEMATICS
  DBT_SNOWFLAKE_USER: TELEMATICS_DBT
  DBT_SNOWFLAKE_ROLE: TELEMATICS_TRANSFORM_ROLE
  DBT_SNOWFLAKE_PRIVATE_KEY: <base64 body of secrets/snowflake_dbt_rsa_key.p8, no header/footer/newlines>
