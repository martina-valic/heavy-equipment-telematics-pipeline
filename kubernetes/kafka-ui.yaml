apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels: {app: kafka-ui}
spec:
  selector: {app: kafka-ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels: {app: kafka-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-ui}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.3.0
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: telematics-minikube}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:29092"}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME, value: telematics-connect}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS, value: "http://kafka-connect:8083"}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
