# Reference only: the shape of the two Secrets that deploy.sh creates from .env.
# Do not fill these in and apply them by hand. Real secret manifests are gitignored.
#
# postgres-credentials: everything the database pod needs to initialise itself and its roles.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: telematics
type: Opaque
stringData:
  POSTGRES_DB: telematics_legacy
  POSTGRES_USER: telematics_admin
  POSTGRES_PASSWORD: <from .env>
  POSTGRES_CDC_USER: debezium_cdc
  POSTGRES_CDC_PASSWORD: <from .env>
  POSTGRES_APP_USER: legacy_app
  POSTGRES_APP_PASSWORD: <from .env>
---
# postgres-cdc-credentials: only what Kafka Connect resolves for the Debezium connector.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-cdc-credentials
  namespace: telematics
type: Opaque
stringData:
  POSTGRES_DB: telematics_legacy
  POSTGRES_CDC_USER: debezium_cdc
  POSTGRES_CDC_PASSWORD: <from .env>
