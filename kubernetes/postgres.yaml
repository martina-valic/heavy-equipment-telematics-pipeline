# Legacy fleet database (Module 3), mirroring the "postgres" service in docker/docker-compose.yml.
# deploy.sh creates the postgres-init-scripts ConfigMap from 03_cdc_migration/postgres/init/ and the
# postgres-credentials Secret from the POSTGRES_* lines of .env. The init scripts run only when the
# volume is empty. Host access: `kubectl -n telematics port-forward svc/postgres 5432:5432`.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16.15
          args:
            - -c
            - wal_level=logical
            # A stopped connector keeps its slot and retains WAL. Cap it so the volume cannot fill up.
            - -c
            - max_slot_wal_keep_size=1GB
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            # A subdirectory, because the volume root contains lost+found and initdb needs an empty dir.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom:
            - secretRef:
                name: postgres-credentials
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init-scripts, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
