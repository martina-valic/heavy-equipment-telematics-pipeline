models:
  - name: stg_telemetry__events
    description: >
      Bronze telemetry records with the contract envelope typed. One row per Kafka record, so
      duplicate deliveries (DUPLICATE_EVENT anomalies, redeliveries) are still here; Silver removes them.
    columns:
      - name: event_id
        description: Event UUID. Unique per event under the contract, but not per row here.
        data_tests:
          - not_null
          - duplicate_rate_at_most:
              config:
                severity: warn
      - name: event_at
        description: UTC time the reading was sampled on the machine.
        data_tests:
          - not_null
      - name: equipment_id
        data_tests:
          - not_null
      - name: operating_state
        data_tests:
          - accepted_values:
              arguments:
                values: [IDLE, OPERATIONAL, FAULT]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [BEV, Diesel]
      - name: readings
        description: The readings array (tag, value, unit, subsystem) as VARIANT.
      - name: produced_at
        description: Kafka CreateTime, when the simulator produced the event.
      - name: ingested_at
        description: When the Snowflake connector pushed the row to Bronze. Incremental models use it as their watermark.
        data_tests:
          - not_null

  - name: stg_telemetry__dlq
    description: Events rejected by the producer's contract check (CONTRACT_VIOLATION), one row per DLQ record.
    columns:
      - name: violation_id
        description: Hash of the Kafka topic, partition and offset.
        data_tests:
          - unique
          - not_null
      - name: failed_at
        data_tests:
          - not_null
      - name: error_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: event_id
        description: event_id from the original payload, when it had one.
      - name: equipment_id
        description: equipment_id from the original payload, when it is a valid number.

  - name: stg_legacy__equipment_changes
    description: Debezium change events for fleet.equipment, one row per Kafka record.
    columns:
      - name: change_id
        description: Hash of (lsn, equipment_id, op), the identity of a change under the data contract.
        data_tests:
          - not_null
      - name: change_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SNAPSHOT, INSERT, UPDATE, DELETE]
      - name: lsn
        description: Postgres log sequence number of the change. Orders the changes to a row.
        data_tests:
          - not_null
      - name: equipment_id
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [ACTIVE, STANDBY, MAINTENANCE, DECOMMISSIONED]

  - name: stg_legacy__hour_meter_log_changes
    description: Debezium change events for fleet.hour_meter_logs, one row per Kafka record.
    columns:
      - name: change_id
        description: Hash of (lsn, log_id, op), the identity of a change under the data contract.
        data_tests:
          - not_null
      - name: change_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SNAPSHOT, INSERT, UPDATE, DELETE]
      - name: lsn
        data_tests:
          - not_null
      - name: log_id
        data_tests:
          - not_null
      - name: hour_meter
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: reading_source
        data_tests:
          - accepted_values:
              arguments:
                values: [SHIFT_REPORT, OPERATOR_LOG, SERVICE_VISIT]
