# Local dev stack for Modules 1-2: single-node KRaft broker, Kafka Connect with the
# Snowflake sink, and Kafka UI. The same stack runs on Minikube from kubernetes/.
# Usage (from repo root): docker compose -f docker/docker-compose.yml up -d --build
name: telematics

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: telematics-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for containers on the compose network, EXTERNAL for clients on the host.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init so the contract's topic names are the only ones.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: telematics-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ../kafka/create_topics.sh:/scripts/create_topics.sh:ro
    entrypoint: ["bash", "/scripts/create_topics.sh"]
    restart: "no"

  kafka-connect:
    build: ../02_streaming_ingestion/connect
    image: telematics/kafka-connect-snowflake:4.2.0
    container_name: telematics-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    # Snowflake settings and SNOWFLAKE_PRIVATE_KEY come from the repo-root .env. Connector configs
    # reference them as ${env:VAR}; worker defaults live in the image (see the Dockerfile).
    env_file:
      - path: ../.env
        required: false
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: telematics-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: telematics-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: telematics-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

volumes:
  kafka-data:
