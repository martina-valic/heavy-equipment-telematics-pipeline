[pytest]
testpaths = testing/python
markers =
    integration: requires the local Kafka stack (docker compose -f docker/docker-compose.yml up -d)
    snowflake: requires Kafka, Kafka Connect with registered connectors, and the Snowflake setup (see 02_streaming_ingestion/README.md)
    cdc: requires Kafka, the legacy Postgres database, and the Debezium connector RUNNING (see 03_cdc_migration/README.md)
